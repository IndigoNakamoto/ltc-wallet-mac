[package]
name = "wallet-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "BDK boundary, DTOs, and encrypted mnemonic storage for the Litecoin Mac wallet"

[features]
default = ["mweb"]
mweb = []

[dependencies]
# Rev-pinned forks so a standalone clone builds reproducibly. The bdk.git rev
# must match the one bdk_wallet's manifest pins, or Cargo builds two copies of
# bdk_chain/bdk_mweb and types stop unifying (the build fails loudly if they
# drift). For local development against sibling checkouts, add [patch]
# overrides in .cargo/config.toml (see docs).
bdk_wallet = { git = "https://github.com/IndigoNakamoto/bdk_wallet.git", rev = "5118184083a2451f49996324f132dfe05c8a8318", default-features = false, features = [
    "std",
    "rusqlite",
    "keys-bip39",
    "mweb",
    "mweb-sqlite",
] }
bdk_electrum = { git = "https://github.com/IndigoNakamoto/bdk.git", rev = "312d0d566a264637c9a7ddfb85d7673a8f351a26", default-features = true }
bdk_mweb = { git = "https://github.com/IndigoNakamoto/bdk.git", rev = "312d0d566a264637c9a7ddfb85d7673a8f351a26", default-features = false, features = [
    "std",
    "zkp",
    "persist",
    "encrypt",
    "encrypt-changeset",
    "rusqlite",
    "lip0006",
    "serde",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
ureq = { version = "2", default-features = true, features = ["json"] }
base64 = "0.22"
hex = "0.4"
zears = { version = "0.2.1", default-features = false }
crc32c = { version = "0.6.8", default-features = false }
scrypt = { version = "0.12.0", default-features = false }

[dev-dependencies]
tempfile = "3"
bdk_wallet = { git = "https://github.com/IndigoNakamoto/bdk_wallet.git", rev = "5118184083a2451f49996324f132dfe05c8a8318", default-features = false, features = [
    "std",
    "rusqlite",
    "keys-bip39",
    "mweb",
    "mweb-sqlite",
    "test-utils",
] }
