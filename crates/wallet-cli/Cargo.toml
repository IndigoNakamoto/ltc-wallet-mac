[package]
name = "wallet-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Smoke CLI for wallet-core create/sync/send on Litecoin (mainnet default)"

[[bin]]
name = "wallet-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
serde_json = "1"
wallet-core = { path = "../wallet-core" }
