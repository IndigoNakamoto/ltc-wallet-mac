# Build, test, lint, and supply-chain checks on every PR and push to main.
#
# All fork dependencies (LitecoinDevKit/bdk, bdk_wallet, rust-litecoin) are
# rev-pinned git deps in the manifests with a committed Cargo.lock, so a plain
# checkout builds standalone. If the bdk rev pinned here ever diverges from
# the one bdk_wallet pins, Cargo builds two copies of bdk_chain/bdk_mweb and
# the build fails on type mismatches — the old pins.env drift check is now
# enforced by the compiler. All third-party actions are pinned to commit SHAs.
#
# The weekly schedule re-runs the supply-chain and frontend audit jobs so new
# advisories against already-merged dependencies are caught without waiting
# for the next code change. The heavyweight Rust build is skipped then.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Mondays 06:00 UTC: weekly advisory sweep (cargo audit / cargo deny / npm audit).
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  rust:
    name: Rust build, clippy, tests
    runs-on: ubuntu-22.04
    # Code didn't change on a schedule tick; only advisories may have.
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch snapshot
        with:
          toolchain: "1.97.1"
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Check lockfile is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Tests
        run: cargo test --workspace --locked

  supply-chain:
    name: cargo audit + cargo deny
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2.85.6
        with:
          tool: cargo-audit,cargo-deny

      - name: cargo audit
        run: cargo audit

      - name: cargo deny
        run: cargo deny check advisories bans licenses sources

  frontend:
    name: Frontend build + npm audit
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout wallet
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Type-check and build UI
        run: npm run build
